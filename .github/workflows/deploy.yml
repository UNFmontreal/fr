# Created with `jupyter-book init --gh-pages` 🪄 💚
# Ensure your GitHub Pages settings for this repository are set to deploy with **GitHub Actions**.

name: Jupyter Book (via myst) GitHub Pages Deploy
on:
  push:
    branches: [main]

env:
  # Site will be served at https://unfmontreal.github.io/fr
  BASE_URL: /fr/

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 18.x
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Jupyter Book (via myst)
        run: |
          python -m pip install --upgrade pip
          python -m pip install jupyter-book
      - name: Build HTML Assets
        run: jupyter-book build --html
      - name: Inject Google Translate widget
        run: |
          python3 << 'PYEOF'
          import os

          head_snippet = """<style>
          #google_translate_element { display:none; }
          .goog-te-banner-frame { display:none !important; }
          body { top: 0 !important; }
          </style>
          <script type="text/javascript">
          function googleTranslateElementInit() {
            new google.translate.TranslateElement({
              pageLanguage: 'fr',
              includedLanguages: 'en',
              autoDisplay: false
            }, 'google_translate_element');
          }
          </script>
          <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>"""

          body_snippet = """<div id="google_translate_element"></div>
          <script>
          document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('a[href="#translate"]').forEach(function(a) {
              a.addEventListener('click', function(e) {
                e.preventDefault();
                var sel = document.querySelector('.goog-te-combo');
                if (sel) { sel.value = 'en'; sel.dispatchEvent(new Event('change')); }
              });
            });
          });
          </script>"""

          for root, dirs, files in os.walk('_build/html'):
            for fname in files:
              if fname.endswith('.html'):
                path = os.path.join(root, fname)
                with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                  content = f.read()
                content = content.replace('</head>', head_snippet + '\n</head>', 1)
                content = content.replace('</body>', body_snippet + '\n</body>', 1)
                with open(path, 'w', encoding='utf-8') as f:
                  f.write(content)
          PYEOF
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_build/html'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
